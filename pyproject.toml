[project]
name = "kucoin-lake"
version = "0.1.0"
description = "Canonical data lake, metadata, integrity, and universe engineering for KuCoin futures/spot Parquet data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Private" }

authors = [
    { name = "Ben Church" }
]

dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4.0",
    "mypy>=1.8",
    "ipython",
]

# Optional: future CLI entrypoint (safe to keep even if cli.py is not ready yet)
[project.scripts]
kucoin-lake = "kucoin_lake.cli:main"

# ----------------------------------------
# Build system (standard, minimal)
# ----------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kucoin_lake*"]

# ----------------------------------------
# Ruff (lint + formatter)
# ----------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I"]   # sensible defaults: errors, pyflakes, import order
ignore = ["E501"]         # we rely on formatter for line length

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------
# Pytest
# ----------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["kucoin_lake"]
addopts = "-q"

# ----------------------------------------
# Mypy (optional, conservative defaults)
# ----------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = false
